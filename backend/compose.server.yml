services:
  gateway:
    image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
    container_name: zhiyun-gateway
    restart: unless-stopped
    stop_grace_period: 130s
    user: "10001:10001"
    read_only: true
    working_dir: /app
    command: ["python", "backend/server.py", "serve"]
    env_file: ./gateway.env
    volumes:
      - ./backend:/app/backend:ro
      - ./data:/data:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 160m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [existing_proxy]
networks:
  existing_proxy:
    external: true
    name: deploy_internal
